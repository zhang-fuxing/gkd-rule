name: build_release

on: workflow_dispatch

jobs:
  build_release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - uses: pnpm/action-setup@v6

      - run: pnpm install

      - run: pnpm run build

      - id: version
        run: |
          version=$(node -e "import('@gkd-kit/tools').then((m) => m.stdoutGkdVersion());")
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # 构建后确认 dist 真的产生了变化
      # 内容没变化时 updateDist 会输出 No changes, 此时没有新版本可发布
      # 明确跳过而不是靠 continue-on-error 掩盖 "nothing to commit" 的失败
      - name: Check dist changes
        id: changes
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- dist)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=无变更::dist 与仓库内容一致 (v${{ steps.version.outputs.version }}), 没有新版本可发布, 已跳过提交、推送与 Release"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到 dist 变更:"
            git status --short -- dist
          fi

      - name: Git commit
        if: ${{ steps.changes.outputs.changed == 'true' }}
        run: |
          git config --local user.email github-actions[bot]@users.noreply.github.com
          git config --local user.name github-actions[bot]
          git add dist
          git commit -m "chore: v${{ steps.version.outputs.version }}"

      - name: Git push
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: ad-m/github-push-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          tags: true

      - name: Create Release
        if: ${{ steps.changes.outputs.changed == 'true' }}
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.version }}
          release_name: Release ${{ steps.version.outputs.version }}
          body_path: ./dist/CHANGELOG.md
